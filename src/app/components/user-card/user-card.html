<article class="user-card">
    <div class="card-header">
    <img class="avatar" [src]="user().image" [alt]="'Avatar de ' + user().name">
        <!-- Son equivalentes, solo que el de arriba "[] le indica que va a recibir un objeto:
    <img class="avatar" src="{{user.image}}" alt="{{'Avatar de ' + user.name}}">  -->
    </div>

    <div class="card-body">
    <span class="user-badge">ID: {{ user().id }}</span>
    <h2 class="user-name">{{ user().name }}</h2>
    <p class="user-username">&#64;{{ user().username }}</p>
    <p class="user-email">{{ user().email }}</p>
    <button type="button" (click)="borrarClick()">Eliminar</button>
    </div>
</article>
